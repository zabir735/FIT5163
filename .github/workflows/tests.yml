name: tests

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: same tests on BN254 (the paper's curve)
        run: go vet -tags bn256 ./... && go test -tags bn256 ./...
